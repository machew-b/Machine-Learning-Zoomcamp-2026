apiVersion: apps/v1
kind: Deployment
metadata:
  name: readmission-risk
  labels:
    app: readmission-risk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: readmission-risk
  template:
    metadata:
      labels:
        app: readmission-risk
    spec:
      containers:
        - name: readmission-risk
          image: readmission-risk:1.0
          # the image is loaded into the kind cluster with `kind load docker-image`, never pulled
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9696
          env:
            - name: PORT
              value: "9696"
          readinessProbe:
            httpGet:
              path: /health
              port: 9696
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9696
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
