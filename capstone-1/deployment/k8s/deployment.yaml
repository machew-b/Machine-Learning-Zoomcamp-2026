apiVersion: apps/v1
kind: Deployment
metadata:
  name: seoul-bike-demand
  labels:
    app: seoul-bike-demand
spec:
  replicas: 2
  selector:
    matchLabels:
      app: seoul-bike-demand
  template:
    metadata:
      labels:
        app: seoul-bike-demand
    spec:
      containers:
        - name: seoul-bike-demand
          image: seoul-bike-demand:1.0
          # the image is loaded into the kind cluster with `kind load docker-image`, never pulled
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9696
          env:
            - name: PORT
              value: "9696"
          readinessProbe:
            httpGet:
              path: /health
              port: 9696
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9696
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
